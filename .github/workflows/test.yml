name: Tests

on:
  push:
    branches: [ master, build-test ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Test against the system Perl + system GTK/Crypt packages on every
        # Ubuntu LTS we ship .deb packages for. Adding more Perl versions
        # via shogo82148/actions-setup-perl doesn't buy us much — our actual
        # users get the system Perl, not a CPAN-built one.
        include:
          - runner: ubuntu-22.04
            perl: '5.34'
          - runner: ubuntu-24.04
            perl: '5.38'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Perl version
        run: perl -v | head -2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            perl \
            libtest-exception-perl \
            libgtk3-perl \
            gir1.2-gtk-3.0 \
            gir1.2-vte-2.91 \
            gir1.2-wnck-3.0 \
            libvte-2.91-0 \
            libexpect-perl \
            libyaml-perl \
            libcrypt-cbc-perl \
            libcrypt-blowfish-perl \
            libglib-perl \
            libcairo-perl \
            libpango-perl \
            libxml-parser-perl \
            libnet-arp-perl \
            libuuid-tiny-perl \
            libcrypt-rijndael-perl \
            libgtk3-simplelist-perl \
            libsocket6-perl \
            shellcheck \
            xvfb \
            x11-utils

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Wait until Xvfb is ready (up to 10 seconds)
          for i in $(seq 1 10); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Install lint + test tooling
        run: |
          sudo apt-get install -y \
            libtest-simple-perl libperl-critic-perl perltidy \
            libcrypt-pbkdf2-perl libtry-tiny-perl

      - name: Run full test suite (prove -lr t/)
        run: prove -lr t/

      - name: Perl::Critic gate (legacy, severity 4 — informational)
        run: |
          perlcritic --gentle --severity 4 \
            --profile .perlcriticrc \
            lib/PACMain.pm lib/PACUtils.pm asbru-cm \
            || (echo '::warning::perlcritic findings (non-fatal during ratchet-down phase)' && true)

      - name: Perl::Critic gate (new modules, severity 3 — enforced)
        run: |
          # All modules under lib/PAC/* and the small extracted modules at
          # lib/PACSshConfig.pm must pass the stricter profile. New code
          # is held to a higher bar than the legacy god-objects.
          perlcritic --severity 3 --profile .perlcriticrc-strict \
            lib/PAC/ lib/PACSshConfig.pm

      - name: Static asset linter (no dead Lucide refs)
        run: prove -lv t/20-no-dead-assets.t

      - name: Shell-form system audit (informational)
        run: sh ci/no-shell-form.sh

      - name: Security regression suite
        run: |
          prove -lv \
            t/13-security-hardening.t \
            t/14-security-functional.t \
            t/18-storable-rce-gate.t \
            t/19-vault-ct-compare.t

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    # Coverage is informational on every push, gate kicks in on PRs.
    continue-on-error: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            perl libgtk3-perl libvte-2.91-0 libexpect-perl libyaml-perl \
            libcrypt-cbc-perl libcrypt-rijndael-perl libcrypt-pbkdf2-perl \
            libsocket6-perl libnet-arp-perl libuuid-tiny-perl \
            libgtk3-simplelist-perl libtry-tiny-perl libtest-exception-perl \
            libdevel-cover-perl xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run test suite under Devel::Cover
        run: |
          PERL5OPT='-MDevel::Cover=-silent,1,-summary,0,+ignore,^t/' \
            prove -lr t/ || true
          cover -summary -report text > coverage.txt 2>&1 || true
          tail -50 coverage.txt

      - name: Extract total coverage
        id: cov
        run: |
          PCT=$(grep -E '^Total' coverage.txt | awk '{print $NF}' | tr -d '%' || echo 0)
          echo "Total coverage: ${PCT}%"
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline
        run: |
          BASELINE=$(cat .coverage-baseline 2>/dev/null || echo 0)
          PCT=${{ steps.cov.outputs.pct }}
          echo "Baseline: ${BASELINE}%   Current: ${PCT}%"
          # Allow 1pp slip; fail PR if coverage drops more than that.
          if awk "BEGIN{exit !($PCT + 1 < $BASELINE)}"; then
            echo "::error::Coverage dropped from ${BASELINE}% to ${PCT}% (>1pp)"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.txt
            cover_db/
          if-no-files-found: warn

  shellcheck-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: ShellCheck ci/build_package.sh
        run: shellcheck --severity=error ci/build_package.sh

      - name: ShellCheck docker scripts
        run: |
          shellcheck --severity=error docker/build-deb/test.sh
          shellcheck --severity=error docker/build-rpm/test.sh
          shellcheck --severity=error docker/test/entrypoint.sh
